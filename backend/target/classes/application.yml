spring:
  application:
    name: vaultivo-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vaultivo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - email
              - profile

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-min-256-bits-long}
    access-token-expiry-minutes: 30
    refresh-token-expiry-days: 14

  storage:
    provider: ${STORAGE_PROVIDER:S3}
    default-quota-bytes: 5368709120
    s3:
      bucket: ${S3_BUCKET:vaultivo-dev}
      region: ${AWS_REGION:ap-south-1}
      endpoint: ${AWS_S3_ENDPOINT:}
      presigned-url-expiry-minutes: 15

  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  rate-limit:
    public-link-requests-per-minute: 30
    api-requests-per-minute: 120

logging:
  level:
    com.vaultivo: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN