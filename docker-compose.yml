services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaultivo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vaultivo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible local storage — lets you test the full upload/download
  # flow (presigned URLs and all) without an AWS account. The backend's
  # S3Config points at this via AWS_S3_ENDPOINT (see backend/.vscode/launch.json
  # or the env vars below).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console — http://localhost:9001
    volumes:
      - vaultivo_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off container: creates the bucket and applies CORS, then exits.
  # Re-running `docker compose up` is safe — mb/cors are idempotent-ish
  # (mb failing because the bucket already exists is swallowed by `|| true`).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc mb local/vaultivo-dev || true) &&
      mc cors set local/vaultivo-dev /cors.json
      "
    volumes:
      - ./cors.json:/cors.json:ro

volumes:
  vaultivo_pgdata:
  vaultivo_miniodata:
